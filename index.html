<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCare Plus – Landing Demo</title>

  <!-- Tailwind CSS CDN (v3.x) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Modular JavaScript -->
  <script type="module" src="js/app.js" defer></script>
</head>
<body class="bg-background text-primary font-sans">

  <!-- Skip link – visible only on focus -->
  <a href="#main-content"
     class="skip-link sr-only focus:not-sr-only focus-visible:outline-none focus-visible:ring-2 focus-visible-ring-primary">
    Ir al contenido principal
  </a>

  <!-- Anchor “home” for the brand link -->
  <div id="home"></div>

  <!-- ==================== HEADER ==================== -->
  <header class="sticky top-0 bg-surface shadow-md z-50">
    <div class="max-w-7xl mx-auto flex items-center justify-between px-4 py-3 md:py-4">

      <!-- Brand -->
      <a href="#home"
         class="flex items-center space-x-2 text-2xl font-serif heading-serif text-primary"
         id="brand-name">
         <img src="assets/icons/Logotipo sanitario MediCare Plus.png"
              alt="Logotipo de MediCare Plus"
              class="h-8 w-auto">
         <span>MediCare Plus</span>
      </a>

      <!-- Mobile button (visible ≤ md) -->
      <button id="mobile-menu-btn"
              class="md:hidden inline-flex items-center justify-center p-2 rounded-md focus-visible:outline-none focus-visible-ring-primary"
              aria-controls="mobile-menu"
              aria-expanded="false"
              aria-label="Abrir menú">
        <!-- Heroicon menu -->
        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <!-- Desktop navigation -->
      <nav class="hidden md:flex space-x-6"
           aria-label="Navegación principal"
           id="desktop-nav">
        <a href="#home"
           class="nav-link flex items-center text-secondary hover:text-primary focus-visible:outline-none focus-visible-ring-primary"
           data-nav="home">
          <svg class="w-4 h-4 mr-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M13 5v6h6"/></svg>
          <span class="nav-text"></span>
        </a>
        <a href="#services"
           class="nav-link flex items-center text-secondary hover:text-primary focus-visible:outline-none focus-visible-ring-primary"
           data-nav="services">
          <svg class="w-4 h-4 mr-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6"/></svg>
          <span class="nav-text"></span>
        </a>
        <a href="#team"
           class="nav-link flex items-center text-secondary hover:text-primary focus-visible:outline-none focus-visible-ring-primary"
           data-nav="team">
          <svg class="w-4 h-4 mr-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14"/></svg>
          <span class="nav-text"></span>
        </a>
        <a href="#appointment"
           class="nav-link flex items-center text-secondary hover:text-primary focus-visible:outline-none focus-visible-ring-primary"
           data-nav="appointment">
          <svg class="w-4 h-4 mr-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10"/></svg>
          <span class="nav-text"></span>
        </a>
        <a href="#contact"
           class="nav-link flex items-center text-secondary hover:text-primary focus-visible:outline-none focus-visible-ring-primary"
           data-nav="contact">
          <svg class="w-4 h-4 mr-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12H8"/></svg>
          <span class="nav-text"></span>
        </a>
      </nav>

      <!-- Language selector (dropdown with flags) -->
      <div class="relative" id="lang-dropdown">
        <button id="lang-toggle"
                class="flex items-center space-x-1 px-2 py-1 rounded-md bg-gray-200 text-primary focus-visible:outline-none focus-visible-ring-primary"
                aria-haspopup="true"
                aria-expanded="false"
                aria-label="Cambiar idioma">
          <!-- Globe icon -->
          <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 12c2.21 0 4-1.79 4-4S14.21 4 12 4 8 5.79 8 8s1.79 4 4 4z"/></svg>
          <span id="current-lang-label">ES</span>
        </button>
        <ul id="lang-menu"
            class="absolute right-0 mt-2 w-24 bg-white border border-gray-200 rounded-md shadow-lg hidden">
          <li>
            <button data-lang="es"
                    class="flex items-center w-full px-2 py-1 hover:bg-gray-100 focus-visible:outline-none focus-visible-ring-primary">
              <!-- Flag Spain -->
              <svg class="w-4 h-4 mr-1" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="480" fill="#c60b1e"/><rect y="160" width="640" height="160" fill="#ffc400"/></svg>
              <span>ES</span>
            </button>
          </li>
          <li>
            <button data-lang="en"
                    class="flex items-center w-full px-2 py-1 hover:bg-gray-100 focus-visible:outline-none focus-visible-ring-primary">
              <!-- Flag United Kingdom -->
              <svg class="w-4 h-4 mr-1" viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg"><clipPath id="t"><path d="M0 0h60v30H0z"/></clipPath><g clip-path="url(#t)"><rect width="60" height="30" fill="#012169"/><path d="M0 0l60 30M60 0L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30M60 0L0 30" stroke="#C8102E" stroke-width="4"/><rect width="60" height="30" fill="none" stroke="#fff" stroke-width="10"/></g></svg>
              <span>EN</span>
            </button>
          </li>
        </ul>
      </div>
    </div>

    <!-- Mobile menu (hidden by default) -->
    <div id="mobile-menu"
         class="md:hidden hidden px-4 pb-4 space-y-4">
      <a href="#home"
         class="nav-link block text-secondary hover:text-primary focus-visible:outline-none focus-visible-ring-primary"
         data-nav="home"></a>
      <a href="#services"
         class="nav-link block text-secondary hover:text-primary focus-visible:outline-none focus-visible-ring-primary"
         data-nav="services"></a>
      <a href="#team"
         class="nav-link block text-secondary hover:text-primary focus-visible:outline-none focus-visible-ring-primary"
         data-nav="team"></a>
      <a href="#appointment"
         class="nav-link block text-secondary hover:text-primary focus-visible:outline-none focus-visible-ring-primary"
         data-nav="appointment"></a>
      <a href="#contact"
         class="nav-link block text-secondary hover:text-primary focus-visible:outline-none focus-visible-ring-primary"
         data-nav="contact"></a>
    </div>
  </header>

  <!-- ==================== MAIN ==================== -->
  <main id="main-content" class="pt-8">

    <!-- HERO (split) -->
    <section id="hero"
             class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8 px-4 lg:px-8 py-12 items-center"
             aria-labelledby="hero-title">
      <!-- Text -->
      <div class="space-y-4">
        <h1 id="hero-title"
            class="heading-serif text-4xl lg:text-5xl text-primary"></h1>
        <p id="hero-description"
           class="text-lg text-secondary"></p>
        <a href="#appointment"
           id="hero-cta"
           class="inline-block btn-primary mt-4"></a>
      </div>

      <!-- Image -->
      <div class="relative">
        <!-- Placeholder – replace with the real image at assets/images/hero.jpg -->
        <img src="assets/images/hero.jpg"
             id="hero-image"
             class="w-full h-auto rounded-lg object-cover"
             alt="">
      </div>
    </section>

    <!-- Remaining sections will be added in later phases -->
  </main>
</body>
</html>
